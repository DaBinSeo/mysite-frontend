name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # Actions 화면에서 수동 재배포

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 배포 도중 끊기지 않게 PR에서만 이전 실행을 취소한다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # main에 push되고 lint-build를 통과하면 운영 서버에 배포한다
  deploy:
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 배포 키는 서버 authorized_keys에서 command=로 묶여 있어 배포 명령만 실행된다
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" frontend

      - name: Health check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          test -n "$DEPLOY_URL"
          curl -fsS -o /dev/null --retry 10 --retry-delay 3 --retry-all-errors "$DEPLOY_URL/"
